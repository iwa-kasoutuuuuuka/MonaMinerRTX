# ==============================================================================
# Monacoin Core Node Configuration for MonaMinerRTX Solo Mining
# ==============================================================================

# Enable JSON-RPC server
server=1
listen=1
daemon=0

# RPC Credentials (Default credentials matching MonaMinerRTX)
rpcuser=monacoinrpc
rpcpassword=rpcpassword

# RPC Port (Default: 9402)
rpcport=9402

# Allowed IP addresses for RPC calls (Localhost only for security)
rpcallowip=127.0.0.1
rpcallowip=::1

# High performance memory cache for rapid blockchain sync (in megabytes)
dbcache=4096

# Fallback transaction fee
fallbackfee=0.0001

# Transaction index (optional, beneficial for block explorers and wallet checks)
txindex=1
